name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # stdlib-only repo: no dependencies, no lockfile, nothing to install
      - run: npm test
      # pre-registered invariants + determinism gate: run-warm --check
      # recomputes the whole experiment in memory and byte-compares it
      # against receipts/warm-start.jsonl — it NEVER writes (the --check
      # mode added when the receipt gained its pre-registered fields).
      - run: node run-warm.mjs --check
